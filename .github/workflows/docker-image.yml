name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag imail:latest
    - name: Export image as tar.gz (for artifact)
      run: |
            docker save imail:latest | gzip > imail-latest.tar.gz
            echo "filename=imail-latest.tar.gz" >> $GITHUB_ENV

    - name: Upload Docker image as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ github.sha }}
        path: ${{ env.filename }}
        retention-days: 30          # 保留 30 天，可调整
